name: Check experiment artifacts
on: [push, pull_request]
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_results.py
      - run: python scripts/verify_evaluation_history.py
      - run: python scripts/verify_final_results.py
      - run: python -m compileall -q scripts overlays tests
      - run: bash -n train.sh eval.sh
